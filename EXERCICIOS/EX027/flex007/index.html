    <title>Flexbox</title>
    <style>
        div.conteiner{
            background-color: lightsalmon;
            display: flex;
            flex-flow: row wrap;
            align-items: flex-start;
            height: 200px;
        }

        div.item{
            background-color: lightblue;
            text-align: center;
            border: 1px solid black;
            padding: 20px;
        }

            /* align-self: auto,  */


        #ia {
            
        }

        #ib {
           
        }

        #ic {
           align-self: flex-end;
        }

        #id {
           
        }

        #ie {
          align-self: center;
        }

        #if {
           
        }

        #ig {
          align-self: stretch;
        }

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="ia">A</div>
        <div class="item" id="ib">B</div>
        <div class="item" id="ic">C</div>
        <div class="item" id="id">D</div>
        <div class="item" id="ie">E</div>
        <div class="item" id="if">F</div>
        <div class="item" id="ig">G</div>
    </div>
</body>
</html>
