<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="imagens/netflix icone.png" type="image/x-icon">
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="#">
                <img src="imagens/netflix-94.png" alt="">
            </a>
        </div>
    </header>

    <main class="login_body">
        <div class="login_box">
            <h2>Entrar</h2>
            <form action="#" method="get">
                <div class="input_box">
                    <input type="text" name="user" id="iuser" placeholder="Email ou número de telefone" required>
                </div>
                <div class="input_box">
                    <input type="password" name="senhar" id="isenha" placeholder="Senha" required>
                </div>
                <div>
                    <button>Entrar</button>
                </div>
            </form>

            <div class="support">
                <div class="remember">
                    <span><input type="checkbox" name="remember" id="iremember" style="margin: 0; padding: 0; height: 13px;"></span>
                    <span>Lembre-se de mim</span>
                </div>
                <div class="help">
                    <a href="#">
                        Precisa de ajuda?
                    </a>
                </div>
            </div>
            
            <div class="login_footer">
                <div class="login_facebook">
                    <span><img height="20px" src="imagens/icone facebook2.png" alt="#"></span>
                    <span><a href="#">Conectar com o Facebook</a></span>
                </div>

                <div class="sign_up">
                    <p>Novo por aqui? <a href="#">Assine agora.</a></p>
                </div>
                    
                <div class="terms">
                    <p>Esta página é protegida pelo Google reCAPTCHA para garantir quer voçê não é um robô. <a href="#">Saiba mais.</a></p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
